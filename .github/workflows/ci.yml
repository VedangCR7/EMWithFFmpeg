name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./eventmarketersbackend-main

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: eventmarketersbackend-main/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Run database migrations
      run: npx prisma db push
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Run ESLint
      run: npm run lint

    - name: Run tests
      run: npm run test:ci
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        JWT_SECRET: test-jwt-secret
        NODE_ENV: test

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: ./eventmarketersbackend-main/coverage
        flags: backend

  # React Native Tests (if applicable)
  mobile-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install React Native CLI
      run: npm install -g @react-native-community/cli

    - name: Check for package.json
      run: |
        if [ -f "package.json" ]; then
          echo "Found React Native package.json"
          npm ci
          npm run test --if-present
        else
          echo "No React Native package.json found, skipping mobile tests"
        fi

    - name: Run Jest tests (if available)
      run: |
        if [ -f "package.json" ] && grep -q "jest" package.json; then
          npm test -- --watchAll=false --coverage
        fi

  # Docker Build Test
  docker-build:
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
    - uses: actions/checkout@v4

    - name: Build backend Docker image
      working-directory: ./eventmarketersbackend-main
      run: |
        docker build -t eventmarketers-backend:test .

    - name: Test Docker image
      run: |
        docker run --rm eventmarketers-backend:test npm run test:ci
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        JWT_SECRET: test-jwt-secret
        NODE_ENV: test